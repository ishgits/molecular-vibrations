[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molvib"
version = "0.1.0"
description = "Static molecular-vibration PNG rendering from XYZ and Gaussian 16 logs"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["numpy", "pandas", "pyvista", "vtk"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
molvib = "molvib.cli:main"

[tool.setuptools]
packages = ["molvib"]
